<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#141112">
    <title>Grid not found — WSudoku</title>
    <link
      rel="icon"
      href="https://perezhoginviktor.github.io/WSudoku-site/favicon.svg"
      type="image/svg+xml"
    >
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100svh;
        margin: 0;
        padding: 1.5rem;
        place-items: center;
        background: #141112;
        color: #f7f1ed;
      }

      main {
        width: min(34rem, 100%);
        text-align: center;
      }

      .grid {
        display: grid;
        width: 5.5rem;
        height: 5.5rem;
        margin: 0 auto 2rem;
        padding: 0.75rem;
        border: 1px dashed rgba(223, 77, 92, 0.75);
        border-radius: 1.25rem;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.55rem;
      }

      .grid span {
        border-radius: 50%;
        background: #5b5455;
      }

      .grid span:nth-child(5) {
        background: #df4d5c;
      }

      p {
        color: #aaa1a0;
        line-height: 1.7;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(3rem, 10vw, 5rem);
        font-weight: 590;
        letter-spacing: -0.06em;
      }

      a {
        display: inline-flex;
        min-height: 3.4rem;
        align-items: center;
        margin-top: 1rem;
        padding: 0.8rem 1.2rem;
        border-radius: 1rem;
        background: #df4d5c;
        color: #160d0f;
        font-size: 0.85rem;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="grid" aria-hidden="true">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
      </div>
      <h1>Grid not found.</h1>
      <p>
        This square is empty. The puzzle you were looking for may have moved.
      </p>
      <a href="https://perezhoginviktor.github.io/WSudoku-site/">Return to WSudoku</a>
    </main>
  </body>
</html>
